# =============================================================================
# MIDAS 出力図 → Word 帳票 自動作成ツール 設定ファイル
#
#   make_list.py : images/*.emf を PNG 化し、並び順・タイトル付きの list.xlsx を作成
#   main.py      : list.xlsx の内容どおりに PNG を Word (output.docx) へ貼り付け
#
# 文字コードは UTF-8。インデントはスペース2個（タブ不可）。
# 日本語を含む値や ":" "-" を含む値は "" で囲むと安全です。
# =============================================================================

# -----------------------------------------------------------------------------
# 入出力パス（相対パスは、このファイルのあるフォルダが基準）
# -----------------------------------------------------------------------------
list_path: list.xlsx          # make_list.py の出力 / main.py の入力（画像リスト）
image_folder: images          # 元画像(EMF等)を置くフォルダ
output_word_path: output.docx # 出力する Word ファイル。絶対パスも可
template_word_path: ""        # 余白・スタイルを引き継ぐ Word テンプレート。空欄なら白紙から作成

# -----------------------------------------------------------------------------
# 画像の見た目
# -----------------------------------------------------------------------------
convert_to_grayscale: false   # true で白黒(グレースケール)化して貼り付け（印刷用）
page_margin_mm: 20            # 上下左右の余白 [mm]
default_img_width_mm: 145     # 通常ページ（1ページ2枚）の画像幅 [mm]
single_img_width_mm: 145      # 「単独ページ=1」の画像幅 [mm]
max_img_height_mm: 100        # 画像高さの上限 [mm]。超える場合は縦横比を保って縮小
img_width_scale: 1.15         # 上記の画像幅に掛ける倍率（余白調整用。1.0 で等倍）
png_max_width_px: 3000        # PNG 変換時の最大幅 [px]。これより大きい画像のみ縮小（拡大はしない）
                              #   167mm 幅で貼ると約 450dpi。2000 では細線がギザつく
png_colors: 256               # PNG の色数（パレット化）。線画は 256 色で見た目はほぼ変わらず、
                              #   容量が約 1/2.5 になる。0 でフルカラー（高画質・容量大）
                              # ※ 幅・色数を変えて make_list.py を実行すると、PNG は自動で作り直される

# -----------------------------------------------------------------------------
# 文字
# -----------------------------------------------------------------------------
font_family: "MS P明朝"       # 章タイトル・図タイトルのフォント
chap_title_pt: 12             # 章タイトルの文字サイズ [pt]
img_title_pt: 9               # 図タイトルの文字サイズ [pt]

# -----------------------------------------------------------------------------
# Word の構成（見出し・図番号）
# -----------------------------------------------------------------------------
# 章タイトルの出し方
#   header : 各章の最初のページのヘッダーに文字として出す（従来どおり）
#   body   : 本文中に Word の「見出し 1」スタイルで出す
chapter_title_position: header
figure_numbering: false       # true で図タイトルの前に「図 1」「図 2」…を自動付番（Word の図表番号）
figure_label: 図              # 図番号の接頭語

# 同じ種類の図が続くとき、種類が変わったところで改ページするためのキーワード。
# 画像タイトルにこの語（または title_map_members の部材名）が含まれるかで判定する。
page_break_keywords: [節点番号, 要素番号, 断面番号, 床荷重, 梁要素荷重, 節点荷重]

# -----------------------------------------------------------------------------
# 並び順
# リストの先頭ほど先に出力される。ここに無い値は最後尾に回る。
# 比較は大文字小文字を区別しない（荷重ケースのみ）。
# -----------------------------------------------------------------------------

# 荷重ケース。ファイル名の末尾部分（例: sp_1_g_My_CB_L.emf → CB_L）と照合する。
# 応力図の章（3-3〜3-8）の順序も、この並びで決まる。
sort_order_load_cases:
  - CB_L      # 長期
  - ST_EX     # X方向地震時
  - ST_EY     # Y方向地震時
  - ST_EX-    # X方向負加力
  - ST_EY-    # Y方向負加力
  - ST_Mpx    # X方向杭頭曲げ戻し

# 部材種別。ファイル名の3番目（例: sp_1_g_... → g）と照合する。
sort_order_members:
  - g   # 梁
  - c   # 柱
  - w   # 壁
  - b   # ブレース
  - f   # フレーム

# 階。ファイル名の2番目（例: sp_1_g_... → 1）と照合する。
# ※ 実際のモデルに合わせて増減すること
sort_order_floors: [B2, B1, "1", "2", "3", "4", "5", "6", "7", R]
# ↑ "1" のように数字だけの階は必ず "" で囲む（囲まないと数値扱いになり照合できない）

# 応力種別。ファイル名の4番目（例: sp_1_g_My_... → My）と照合する。
# ここに含まれない記号は「応力図」と認識されず、リスト上「その他」に分類される。
sort_order_stresses: [My, Fx, Fz, Mz, Fy]

# -----------------------------------------------------------------------------
# タイトル変換表（ファイル名の記号 → Word に出す日本語）
# -----------------------------------------------------------------------------

# 図タイトルの一部として使う荷重ケース名
#   例: 「長期荷重時_1階梁_曲げモーメント図 My(kNm)」
title_map_load_cases:
  CB_L: 長期荷重時
  ST_EX: X方向地震時
  ST_EY: Y方向地震時
  ST_EX-: X方向負加力地震時
  ST_EY-: Y方向負加力地震時
  ST_Mpx: X方向地震時杭頭曲げ戻し

# 部材名。図タイトルに使うほか、main.py が改ページ位置（部材切替時）の判定にも使う。
title_map_members:
  c: 柱
  g: 梁
  w: 壁
  b: ブレース
  f: フレーム

# 章タイトル（応力図）。ページヘッダーに出力され、章が変わると新しいセクションになる。
# キーは荷重ケース記号。
title_map_chapters:
  CB_L: 3-3.長期荷重時応力図
  ST_EX: 3-4.X方向地震時応力図
  ST_EY: 3-5.Y方向地震時応力図
  ST_EX-: 3-6.X方向負加力地震時応力図
  ST_EY-: 3-7.Y方向負加力地震時応力図
  ST_Mpx: 3-8.X方向地震時杭頭曲げ戻し応力図

# 応力種別の図タイトル。単位は括弧内に記載。
title_map_stresses:
  My: 曲げモーメント図 My(kNm)
  Fx: 軸力図 N(kN)
  Fz: せん断力図 Qy(kN)
  Mz: 曲げモーメント図 Mz(kNm)
  Fy: せん断力図 Qz(kN)

# 章タイトル（モデル情報など、応力図以外）。キーはファイル名中の種別記号:
#   n=節点番号  e=要素番号  s=断面番号  fl=床荷重  nl=節点荷重  bl=梁要素荷重
#   rz=支点反力図  d=変形図
# n/e/s/fl/nl/bl は同じ章(3-2)にまとめる。
title_map_sections:
  n: 3-2.モデル図・荷重図
  e: 3-2.モデル図・荷重図
  s: 3-2.モデル図・荷重図
  fl: 3-2.モデル図・荷重図
  nl: 3-2.モデル図・荷重図
  bl: 3-2.モデル図・荷重図
  rz: 3-9.支点反力図
  d: 3-10.変形図

# -----------------------------------------------------------------------------
# ファイル名ルール（filename_rules）
#   画像ファイル名（拡張子・空白除去後。例: sp_1_g_My_ST_EX）を上から順に照合し、
#   最初に一致したルールで「章・タイトル・並び・単独ページ」を決める。
#   どれにも一致しない画像は章タイトル「その他」になる（make_list.py が警告を出す）。
#   新しい種類の図が増えたら、ここにルールを足すだけでよい（コード修正不要）。
#
#   pattern        正規表現。名前付きグループで値を取り出す:
#                    floor=階  member=部材記号  stress=応力記号  case=荷重ケース
#                  先頭の [^_]+ はプロジェクト接頭語（sp 等）。
#                  stress は sort_order_stresses に含まれる記号のときだけ一致とみなす。
#   title          図タイトルのテンプレート。使える変数:
#                    {floor} {floor_ja} {member} {member_ja} {stress} {stress_ja} {case} {case_ja}
#   order          章の並び順（小さいほど先）。モデル情報=10、応力図=20〜、支点反力=50、変形=60
#   order_from_case  order の代わりに「この値＋荷重ケースの順位」を章順にする（応力図用）
#   chapter_by     case を指定すると章タイトルを title_map_chapters から荷重ケースで引く
#   section        章タイトルを title_map_sections から引くキー（chapter_by を使わない場合）
#   sort_by        type: 章内を「種類(type_order)→階→部材」の順に並べる（モデル情報用）
#                  省略: 「部材→階→応力→荷重ケース」の順
#   type_order     sort_by: type のときの種類の順位
#   single_page    true なら 1 ページに 1 枚だけ貼る
#   single_page_exceptions  グループ名: [値…]。該当したときだけ single_page を反転する
# -----------------------------------------------------------------------------
filename_rules:
  - name: 支点反力図
    pattern: '^[^_]+_rz_(?P<case>.+)$'
    section: rz
    order: 50
    title: "{case_ja}_支点反力図"
    single_page: false
    single_page_exceptions: {case: [CB_L]}      # 長期のみ単独ページ

  - name: 変形図
    pattern: '^[^_]+_d_(?P<case>.+)$'
    section: d
    order: 60
    title: "{case_ja}_変形図"
    single_page: true
    single_page_exceptions: {case: [ST_EX, ST_EY]}   # X/Y 地震時は 2 枚/ページ

  - name: 節点番号
    pattern: '^[^_]+_(?P<floor>[^_]+)_n$'
    section: n
    order: 10
    sort_by: type
    type_order: 1
    title: "{floor_ja}_節点番号"

  - name: 要素番号            # sp_1_e / sp_1_g_e のどちらも可（部材は無視）
    pattern: '^[^_]+_(?P<floor>[^_]+)(?:_[^_]+)?_e$'
    section: e
    order: 10
    sort_by: type
    type_order: 2
    title: "{floor_ja}_要素番号"

  - name: 断面番号（部材別）
    pattern: '^[^_]+_(?P<floor>[^_]+)_(?P<member>[^_]+)_s$'
    section: s
    order: 10
    sort_by: type
    type_order: 3
    title: "{floor_ja}_{member_ja}_断面番号"

  - name: 断面番号
    pattern: '^[^_]+_(?P<floor>[^_]+)_s$'
    section: s
    order: 10
    sort_by: type
    type_order: 3
    title: "{floor_ja}_断面番号"

  - name: 床荷重
    pattern: '^[^_]+_(?P<floor>[^_]+)_fl$'
    section: fl
    order: 10
    sort_by: type
    type_order: 4
    title: "{floor_ja}_床荷重"

  - name: 梁要素荷重
    pattern: '^[^_]+_(?P<floor>[^_]+)_bl$'
    section: bl
    order: 10
    sort_by: type
    type_order: 5
    title: "{floor_ja}_梁要素荷重"

  - name: 節点荷重
    pattern: '^[^_]+_(?P<floor>[^_]+)_nl$'
    section: nl
    order: 10
    sort_by: type
    type_order: 6
    title: "{floor_ja}_節点荷重"

  - name: 応力図                # 例: sp_1_g_My_ST_EX → 1階 / 梁 / My / ST_EX
    pattern: '^[^_]+_(?P<floor>[^_]+)_(?P<member>[^_]+)_(?P<stress>[^_]+)_(?P<case>.+)$'
    order_from_case: 20          # 20 + 荷重ケースの順位 → 荷重ケースごとに別の章になる
    chapter_by: case
    title: "{case_ja}_{floor_ja}{member_ja}_{stress_ja}"
    single_page: false
    single_page_exceptions: {stress: [Fz]}      # せん断力図(Qy)は単独ページ
